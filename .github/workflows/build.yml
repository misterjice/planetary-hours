name: Build

on:
  push:
    branches: [claude/lucid-galileo-11d0id, main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      APP_VERSION: 4.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build x86 and x64
        shell: pwsh
        run: |
          foreach ($arch in 'x86', 'x64') {
            # Rebuild: an incremental build would reuse the previous architecture's compiled output.
            dotnet build ChronosXP/ChronosXP.csproj -c Release -t:Rebuild -p:PlatformTarget=$arch -o "build/$arch"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Verify assembly architectures
        shell: pwsh
        run: |
          # Reads the PE/CLR headers: an assembly is AnyCPU (ILOnly, no Requires32Bit, I386 machine),
          # x86-only (Requires32Bit), or x64-only (Amd64 machine).
          $bad = 0
          foreach ($arch in 'x86', 'x64') {
            foreach ($f in Get-ChildItem "build/$arch" -Recurse -Include *.exe, *.dll) {
              $stream = [IO.File]::OpenRead($f.FullName)
              $pe = [System.Reflection.PortableExecutable.PEReader]::new($stream)
              $machine = $pe.PEHeaders.CoffHeader.Machine.ToString()
              $flags = $pe.PEHeaders.CorHeader.Flags.ToString()
              $pe.Dispose(); $stream.Dispose()
              $kind = if ($machine -eq 'Amd64') { 'x64' } elseif ($flags -match 'Requires32Bit') { 'x86' } else { 'AnyCPU' }
              $ok = ($kind -eq 'AnyCPU' -and $f.Name -ne 'ChronosXP.exe') -or ($kind -eq $arch)
              Write-Host "$arch  $kind  $($f.Name)  $(if ($ok) {'ok'} else {'MISMATCH'})"
              if (-not $ok) { $bad++ }
            }
          }
          if ($bad) { exit 1 }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installers and portable zips
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          New-Item -ItemType Directory -Force installer/output | Out-Null
          foreach ($arch in 'x86', 'x64') {
            Remove-Item "build/$arch/*.pdb" -ErrorAction SilentlyContinue
            & $iscc "/DArch=$arch" "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$PWD\build\$arch" installer\ChronosXP.iss
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Compress-Archive -Path "build/$arch/*" -DestinationPath "installer/output/ChronosXP-$env:APP_VERSION-$arch-portable.zip" -Force
          }
          Get-ChildItem installer/output

      - uses: actions/upload-artifact@v4
        with:
          name: ChronosXP-${{ env.APP_VERSION }}
          path: installer/output/

      - name: Smoke test installed app (x86 and x64)
        shell: pwsh
        run: |
          foreach ($arch in 'x86', 'x64') {
            ./ci/smoke-test.ps1 -Arch $arch -Installer (Get-ChildItem "installer/output/*-$arch-setup.exe").FullName
          }

      - name: Upload smoke-test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-screenshots/
          if-no-files-found: ignore

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:APP_VERSION" (Get-ChildItem installer/output/*).FullName `
            --target "$env:GITHUB_SHA" --title "ChronosXP $env:APP_VERSION" --latest `
            --notes "x86 and x64 installers for Windows 10/11, plus portable zips. Requires .NET Framework 4.8 (built into Windows 10 1903+ and Windows 11)."
