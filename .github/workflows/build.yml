name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build ChronosXP.sln -c Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item ChronosXP/bin/Release/net48/* dist/ -Recurse -Exclude *.pdb
          Compress-Archive -Path dist/* -DestinationPath ChronosXP-win.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ChronosXP-win
          path: dist/
